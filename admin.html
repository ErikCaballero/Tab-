<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Panel de Control - Tabú Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 shadow-xl px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <span class="text-2xl">⚡</span>
            <div>
                <h1 class="text-xl font-black tracking-wider text-indigo-400">TABÚ BACKOFFICE</h1>
                <p class="text-xs text-slate-400">Gestor CRUD total de Base de Datos en tiempo real</p>
            </div>
        </div>
        <div class="bg-slate-950 px-4 py-2 rounded-xl border border-slate-800 flex items-center gap-3 text-sm">
            <span class="text-indigo-400 font-bold"><i class="fa-solid fa-book-bookmark mr-1.5"></i> Total Palabras:</span>
            <span id="contador-global-palabras" class="text-emerald-400 font-black text-base animate-pulse">Cargando...</span>
        </div>
        <nav class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800" id="nav-tabs">
            <button onclick="cambiarPestaña('salas')" id="tab-salas" class="px-4 py-2 rounded-lg text-sm font-bold transition-all bg-slate-800 text-white">Salas</button>
            <button onclick="cambiarPestaña('jugadores')" id="tab-jugadores" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white">Jugadores</button>
            <button onclick="cambiarPestaña('turnos')" id="tab-turnos" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white">Turnos</button>
            <button onclick="cambiarPestaña('mazo_palabras')" id="tab-mazo_palabras" class="px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-400 hover:text-white">Mazo Palabras</button>
        </nav>
    </header>

    <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div>
                <h2 id="titulo-tabla" class="text-lg font-black uppercase text-indigo-300">Tabla: Salas</h2>
                <p class="text-xs text-slate-400">Visualiza, edita o elimina registros de forma directa.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                
                <div id="contenedor-filtros-palabras" class="hidden flex flex-wrap items-center gap-2 flex-1 sm:flex-initial">
                    <div class="relative min-w-[180px]">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                        <input type="text" id="buscar-palabra-input" oninput="filtrarPalabrasLocal()" placeholder="Buscar palabra..." class="bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500 w-full">
                    </div>
                    
                    <select id="filtro-categoria-principal" onchange="filtrarPalabrasLocal()" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500 text-slate-300">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>

                <button onclick="abrirModalCrear()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-plus"></i> Nuevo Registro
                </button>
                <button onclick="vaciarTablaActiva()" class="bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800 text-rose-400 px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i> Vaciar Tabla
                </button>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead id="tabla-cabecera" class="bg-slate-950 border-b border-slate-800 text-xs font-bold uppercase tracking-wider text-slate-400">
                        </thead>
                    <tbody id="tabla-cuerpo" class="divide-y divide-slate-800/60 text-sm text-slate-300">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-crud" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            <div class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
                <h3 id="modal-titulo" class="font-black text-indigo-400 uppercase text-sm tracking-wider">Formulario de Registro</h3>
                <button onclick="cerrarModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="form-crud" onsubmit="guardarRegistro(event)" class="p-6 space-y-4">
                <div id="modal-campos" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                    </div>
                <div class="flex justify-end gap-2 pt-4 border-t border-slate-800/60">
                    <button type="button" onclick="cerrarModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-xs font-black transition shadow-lg shadow-indigo-600/20">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://noirhvzgawswgeegcypg.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vaXJodnpnYXdzd2dlZWdjeXBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzMxNTksImV4cCI6MjA5NTIwOTE1OX0.X9Oo325y5J-GBympMUHajt_o-DUa3eP_yaTsunJudw0";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tablaActiva = 'salas';
        let idEditando = null;
        let listaCompletaPalabras = []; 
        let listaCategoriasUnicas = []; 
        let ultimaCategoriaUsada = "";

        window.onload = () => {
            cambiarPestaña('salas');
            actualizarContadorPalabras();
        };

        async function actualizarContadorPalabras() {
            try {
                const { count, error } = await db.from('mazo_palabras').select('*', { count: 'exact', head: true });
                if (error) throw error;
                document.getElementById('contador-global-palabras').innerText = count;
            } catch (err) {
                console.error("Error al contar palabras:", err);
                document.getElementById('contador-global-palabras').innerText = "Error ❌";
            }
        }

        // Rellena el desplegable de filtrado principal en la barra superior
        function actualizarDesplegableFiltroPrincipal() {
            const selectFiltro = document.getElementById('filtro-categoria-principal');
            const valorSeleccionadoPrevio = selectFiltro.value; 

            selectFiltro.innerHTML = '<option value="">Todas las categorías</option>';
            listaCategoriasUnicas.forEach(cat => {
                const elegido = cat === valorSeleccionadoPrevio ? 'selected' : '';
                selectFiltro.innerHTML += `<option value="${cat}" ${elegido}>${cat}</option>`;
            });
        }

        function cambiarPestaña(tabla) {
            tablaActiva = tabla;
            document.querySelectorAll('#nav-tabs button').forEach(b => {
                b.classList.remove('bg-slate-800', 'text-white');
                b.classList.add('text-slate-400');
            });
            document.getElementById(`tab-${tabla}`).classList.add('bg-slate-800', 'text-white');
            document.getElementById(`tab-${tabla}`).classList.remove('text-slate-400');

            document.getElementById('titulo-tabla').innerText = `Tabla: ${tabla.replace('_', ' ')}`;
            
            if (tabla === 'mazo_palabras') {
                document.getElementById('contenedor-filtros-palabras').classList.remove('hidden');
            } else {
                document.getElementById('contenedor-filtros-palabras').classList.add('hidden');
            }

            cargarDatosTabla();
        }

        async function cargarDatosTabla() {
            const { data, error } = await db.from(tablaActiva).select('*');
            if (error) {
                alert("Error cargando datos: " + error.message);
                return;
            }

            if (tablaActiva === 'mazo_palabras') {
                listaCompletaPalabras = data || [];
                const todas = listaCompletaPalabras.map(item => item.categoria).filter(Boolean);
                listaCategoriasUnicas = [...new Set(todas)].sort();
                
                actualizarDesplegableFiltroPrincipal();
                filtrarPalabrasLocal(); // Aplicar filtros vigentes
                return;
            }

            renderizarTabla(data);
        }

        // Filtra de forma combinada por Texto e Ítem del Desplegable Principal
        function filtrarPalabrasLocal() {
            const busqueda = document.getElementById('buscar-palabra-input').value.toLowerCase();
            const categoriaFiltro = document.getElementById('filtro-categoria-principal').value;

            // Almacenar en memoria la categoría seleccionada en el filtro
            if (categoriaFiltro) {
                ultimaCategoriaUsada = categoriaFiltro;
            }

            const palabrasFiltradas = listaCompletaPalabras.filter(p => {
                const cumpleTexto = p.palabra_principal.toLowerCase().includes(busqueda);
                const cumpleCategoria = categoriaFiltro === "" || p.categoria === categoriaFiltro;
                return cumpleTexto && cumpleCategoria;
            });

            renderizarTabla(palabrasFiltradas);
        }

        function renderizarTabla(data) {
            const cabecera = document.getElementById('tabla-cabecera');
            const cuerpo = document.getElementById('tabla-cuerpo');
            cabecera.innerHTML = '';
            cuerpo.innerHTML = '';

            if (!data || data.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="100%" class="p-8 text-center text-slate-500 text-xs font-semibold">No hay registros encontrados en esta tabla</td></tr>`;
                return;
            }

            const columnas = Object.keys(data[0]);
            
            let htmlCabecera = '<tr>';
            columnas.forEach(col => {
                htmlCabecera += `<th class="p-4">${col}</th>`;
            });
            htmlCabecera += `<th class="p-4 text-right">Acciones</th></tr>`;
            cabecera.innerHTML = htmlCabecera;

            data.forEach(fila => {
                let htmlFila = `<tr class="hover:bg-slate-900/40 transition">`;
                columnas.forEach(col => {
                    let valor = fila[col];
                    if (typeof valor === 'object' && valor !== null) {
                        valor = JSON.stringify(valor);
                    }
                    htmlFila += `<td class="p-4 text-xs font-medium max-w-[200px] truncate" title='${valor}'>${valor ?? '<span class="text-slate-600">null</span>'}</td>`;
                });
                htmlFila += `<td class="p-4 text-right space-x-1 whitespace-nowrap">
                    <button onclick="abrirModalEditar('${fila.id || fila.codigo}')" class="bg-indigo-950 border border-indigo-800 text-indigo-400 px-2.5 py-1 rounded hover:bg-indigo-900/50 text-xs font-bold transition"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="eliminarRegistro('${fila.id || fila.codigo}')" class="bg-rose-950 border border-rose-800 text-rose-400 px-2.5 py-1 rounded hover:bg-rose-900/50 text-xs font-bold transition"><i class="fa-solid fa-trash"></i></button>
                </td></tr>`;
                cuerpo.innerHTML += htmlFila;
            });
        }

        async function abrirModalCrear() {
            idEditando = null;
            document.getElementById('modal-titulo').innerText = `Nuevo Registro en ${tablaActiva.toUpperCase()}`;
            await construirFormularioCampos();
            document.getElementById('modal-crud').classList.remove('hidden');
        }

        async function abrirModalEditar(idUnico) {
            idEditando = idUnico;
            document.getElementById('modal-titulo').innerText = `Editar Registro en ${tablaActiva.toUpperCase()} (${idUnico})`;
            
            let campoFiltro = isNaN(idUnico) && idUnico.length === 4 && tablaActiva === 'salas' ? 'codigo' : 'id';
            const { data, error } = await db.from(tablaActiva).select('*').eq(campoFiltro, idUnico).single();
            
            if (error) {
                alert("Error obteniendo datos del registro");
                return;
            }

            await construirFormularioCampos(data);
            document.getElementById('modal-crud').classList.remove('hidden');
        }

        function manejarCambioCategoriaSelect(selectElement) {
            const contenedorDinamico = document.getElementById('contenedor-categoria-input-libre');
            if (selectElement.value === "__NUEVA__") {
                contenedorDinamico.classList.remove('hidden');
                contenedorDinamico.querySelector('input').focus();
                contenedorDinamico.querySelector('input').required = true;
            } else {
                contenedorDinamico.classList.add('hidden');
                contenedorDinamico.querySelector('input').required = false;
                if (selectElement.value) {
                    ultimaCategoriaUsada = selectElement.value;
                }
            }
        }

        async function construirFormularioCampos(datosExistentes = null) {
            const contenedor = document.getElementById('modal-campos');
            contenedor.innerHTML = '';

            let campos = [];
            if (tablaActiva === 'salas') {
                campos = ['codigo', 'estado', 'modo_juego', 'ronda_actual', 'max_rondas', 'tiempo_ronda', 'max_saltos', 'categoria_id'];
            } else if (tablaActiva === 'jugadores') {
                campos = ['sala_id', 'nombre', 'equipo', 'puntos', 'es_anfitrion', 'sesion_id', 'password'];
            } else if (tablaActiva === 'turnos') {
                campos = ['sala_id', 'jugador_orador_id', 'jugador_adivinador_id', 'palabra_actual_id', 'estado', 'palabras_acertadas', 'palabras_saltadas', 'palabras_tabu', 'numero_ronda'];
            } else if (tablaActiva === 'mazo_palabras') {
                campos = ['palabra_principal', 'palabras_prohibidas', 'categoria'];
            }

            campos.forEach(campo => {
                let valor = datosExistentes ? datosExistentes[campo] : '';
                
                // Si creamos una nueva palabra, hereda de forma automática la categoría seleccionada en el filtro exterior
                if (!datosExistentes && tablaActiva === 'mazo_palabras' && campo === 'categoria' && ultimaCategoriaUsada !== "") {
                    valor = ultimaCategoriaUsada;
                }

                if (typeof valor === 'object' && valor !== null) {
                    valor = JSON.stringify(valor);
                }

                if (tablaActiva === 'mazo_palabras' && campo === 'categoria') {
                    let opcionesHtml = `<option value="">-- Seleccionar Categoría --</option>`;
                    listaCategoriasUnicas.forEach(cat => {
                        const seleccionado = cat === valor ? 'selected' : '';
                        opcionesHtml += `<option value="${cat}" ${seleccionado}>${cat}</option>`;
                    });
                    opcionesHtml += `<option value="__NUEVA__" class="text-indigo-400 font-bold">+ Crear nueva categoría...</option>`;

                    contenedor.innerHTML += `<div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1 tracking-wide">Categoría del Registro</label>
                        <select id="select-categoria-dinamico" name="categoria" onchange="manejarCambioCategoriaSelect(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                            ${opcionesHtml}
                        </select>
                        
                        <div id="contenedor-categoria-input-libre" class="hidden mt-2">
                            <label class="block text-[10px] font-bold text-indigo-400 uppercase mb-1">Nombre de la nueva categoría:</label>
                            <input type="text" id="input-nueva-categoria-libre" placeholder="Ej: videojuegos" class="w-full bg-slate-950 border border-indigo-500/50 rounded-xl px-4 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-400 transition">
                        </div>
                    </div>`;
                } else {
                    let infoHelper = '';
                    if (campo.includes('prohibidas') || campo.includes('acertadas') || campo.includes('saltadas') || campo.includes('tabu')) {
                        infoHelper = '<span class="text-[10px] text-slate-500 block mt-0.5">Formato Array, ej: ["palabra1", "palabra2"]</span>';
                    }

                    contenedor.innerHTML += `<div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1 tracking-wide">${campo.replace('_', ' ')}</label>
                        <input type="text" name="${campo}" value="${valor ?? ''}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                        ${infoHelper}
                    </div>`;
                }
            });
        }

        function cerrarModal() {
            document.getElementById('modal-crud').classList.add('hidden');
            document.getElementById('form-crud').reset();
        }

        async function guardarRegistro(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            let payload = {};

            for (let [key, value] of formData.entries()) {
                if (!value && value !== '0') continue;

                if (['palabras_prohibidas', 'palabras_acertadas', 'palabras_saltadas', 'palabras_tabu'].includes(key)) {
                    try {
                        payload[key] = (typeof value === 'string' && value.includes('[')) 
                            ? JSON.parse(value) 
                            : value.split(',').map(p => p.trim()).filter(Boolean);
                    } catch(err) { payload[key] = []; }
                } else if (['tiempo_ronda', 'max_rondas', 'ronda_actual', 'max_saltos', 'palabra_actual_id', 'puntos', 'numero_ronda'].includes(key)) {
                    payload[key] = parseInt(value);
                } else if (key === 'es_anfitrion') {
                    payload[key] = value === 'true' || value === '1';
                } else {
                    payload[key] = value;
                }
            }

            if (tablaActiva === 'mazo_palabras') {
                const selectCat = document.getElementById('select-categoria-dinamico');
                if (selectCat) {
                    if (selectCat.value === "__NUEVA__") {
                        const inputNueva = document.getElementById('input-nueva-categoria-libre').value.trim();
                        payload['categoria'] = inputNueva || "general";
                    } else {
                        payload['categoria'] = selectCat.value;
                    }
                    
                    // Sincronizar el filtro de la pantalla principal con la categoría que acabas de usar
                    ultimaCategoriaUsada = payload['categoria'];
                    document.getElementById('filtro-categoria-principal').value = ultimaCategoriaUsada;
                }
            }

            let query;
            if (idEditando === null) {
                query = db.from(tablaActiva).insert([payload]);
            } else {
                let campoFiltro = isNaN(idEditando) && idEditando.length === 4 && tablaActiva === 'salas' ? 'codigo' : 'id';
                query = db.from(tablaActiva).update(payload).eq(campoFiltro, idEditando);
            }

            const { error } = await query;

            if (error) {
                alert(`Error al guardar: ${error.message}`);
            } else {
                cerrarModal();
                await cargarDatosTabla();
                await actualizarContadorPalabras();
            }
        }

        async function eliminarRegistro(idUnico) {
            if (!confirm(`¿Estás seguro de eliminar el registro ${idUnico}?`)) return;
            let campoFiltro = isNaN(idUnico) && idUnico.length === 4 && tablaActiva === 'salas' ? 'codigo' : 'id';
            
            const { error } = await db.from(tablaActiva).delete().eq(campoFiltro, idUnico);
            if (error) {
                alert("Error al eliminar: " + error.message);
            } else {
                cargarDatosTabla();
                actualizarContadorPalabras();
            }
        }

        async function vaciarTablaActiva() {
            if (!confirm(`¿Quieres VACIAR COMPLETAMENTE la tabla "${tablaActiva}"?`)) return;
            const { error } = await db.from(tablaActiva).delete().neq('id', '00000000-0000-0000-0000-000000000000');
            if (error) {
                alert("Error al vaciar: " + error.message);
            } else {
                cargarDatosTabla();
                actualizarContadorPalabras();
            }
        }
    </script>
</body>
</html>
